<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="640" fill="#0f1420"/>

  <text x="450" y="45" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">
    Real-Time Chat App — Deployment Architecture
  </text>

  <!-- User Browser -->
  <rect x="350" y="80" width="200" height="70" rx="10" fill="#2563eb"/>
  <text x="450" y="110" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">User Browser</text>
  <text x="450" y="132" text-anchor="middle" fill="#dbeafe" font-size="12">Opens http://3.25.23.224</text>

  <!-- Arrow down -->
  <line x1="450" y1="150" x2="450" y2="195" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AWS EC2 outer box -->
  <rect x="80" y="200" width="740" height="400" rx="14" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="100" y="225" fill="#f59e0b" font-size="15" font-weight="bold">AWS EC2 Instance (Public IP: 3.25.23.224)</text>

  <!-- Nginx container -->
  <rect x="150" y="250" width="600" height="130" rx="10" fill="#16a34a"/>
  <text x="450" y="278" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">NGINX Container (chat-nginx)</text>
  <text x="450" y="298" text-anchor="middle" fill="#dcfce7" font-size="12">Listens on port 80 · Reverse Proxy</text>

  <rect x="180" y="315" width="250" height="50" rx="6" fill="#15803d"/>
  <text x="305" y="336" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">location /</text>
  <text x="305" y="352" text-anchor="middle" fill="#dcfce7" font-size="10">Serves static frontend files</text>

  <rect x="470" y="315" width="250" height="50" rx="6" fill="#15803d"/>
  <text x="595" y="336" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">location /ws</text>
  <text x="595" y="352" text-anchor="middle" fill="#dcfce7" font-size="10">Proxies WebSocket + Upgrade headers</text>

  <!-- Arrows from nginx down to backend and volume -->
  <line x1="305" y1="380" x2="305" y2="430" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="595" y1="380" x2="595" y2="430" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Frontend volume box -->
  <rect x="180" y="435" width="250" height="60" rx="8" fill="#334155"/>
  <text x="305" y="460" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">./frontend volume</text>
  <text x="305" y="478" text-anchor="middle" fill="#cbd5e1" font-size="10">index.html (mounted, read-only)</text>

  <!-- Backend container -->
  <rect x="470" y="435" width="250" height="90" rx="8" fill="#7c3aed"/>
  <text x="595" y="462" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Backend Container</text>
  <text x="595" y="480" text-anchor="middle" fill="#ede9fe" font-size="11">(chat-backend)</text>
  <text x="595" y="497" text-anchor="middle" fill="#ede9fe" font-size="11">FastAPI + Uvicorn on :8000</text>
  <text x="595" y="514" text-anchor="middle" fill="#ede9fe" font-size="10">WebSocket endpoint: /ws</text>

  <!-- Docker network label -->
  <rect x="150" y="545" width="570" height="34" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="435" y="567" text-anchor="middle" fill="#38bdf8" font-size="12">Shared Docker Bridge Network: "chat-network" (service-name DNS resolution)</text>

  <!-- Legend -->
  <text x="100" y="620" fill="#94a3b8" font-size="11">restart: always is set on both containers · Only port 80 is exposed to the public internet</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
